<!DOCTYPE html>

    <title>Brasileirão 2026</title>
    <style>
        /* Corpo da página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Cabeçalho da página */
        .header-principal {
            border-width: 10px;
            border-style: solid;
            border-color: #808080 #bdbcbc ;
            padding: 10px;
            background-color: rgb(14, 150, 1);
            font-size: 40px;
            text-align: center;
            color: white;
        }
        /* Conteúdo principal */

        .rodada {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            border-width: 5px;
            border-style: solid;
            border-color: #808080 #bdbcbc;
            background-color: #6e6e6c;
            color: #f4f4f4;
        }

        .partidas {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            flex-wrap: wrap;
            gap: 10px;
        }

        .partida {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .clube {
            margin-top: 10px;
            width: 50px;
            height: 50px;
            background-size: contain;
            background-position: center;
            border: 5px solid black;
        }

        .placar, .versus {
            font-size: x-large;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-align: center;
        }
        
        /* Escudo dos times */
